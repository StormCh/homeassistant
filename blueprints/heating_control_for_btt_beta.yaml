blueprint:
  name: BETATESTS ONLY - Heating Control for BT Thermostats
  description: >
    # Heating Control for BT Thermostats

    **Version 0.20.0**

    Merged in the 0.18.2 anti-flicker fix (offset condition on the after-reset
    branch) from the stable blueprint. Uses the stable core
    `climate.set_temperature` service instead of the removed
    `better_thermostat.set_temp_target_temperature` action (removed upstream
    in better_thermostat 1.8.0).

    **New in 0.20.0:** fixed presence detection (compared against the zone's
    friendly name before, which fails for renamed/localized zones - now
    compares against the zone's actual object_id/slug); added a debounce on
    the sensor trigger; skips re-sending commands that would not change
    anything (also stops the cool-down dip from repeating every 5 minutes
    once the thermostat is already off); the safety dip temperature is now a
    configurable input; inputs are grouped into collapsible sections.

  domain: automation
  source_url: https://github.com/StormCh/homeassistant/blob/main/blueprints/heating_control_for_btt_beta.yaml
  input:
    section_presence:
      name: Presence & Schedule
      icon: mdi:home-account
      collapsed: false
      input:
        zone_entity:
          name: Zone
          description: (Required) Zone
          default: home
          selector:
            entity:
              filter:
              - domain:
                - zone
              multiple: false

        input_persons:
          name: Person at Zone
          description: (Required) Presence, start heating only if someone (one of there persons) is at zone.
          default: []
          selector:
            entity:
              filter:
                - domain: person
              multiple: true

        bt_times_schedule:
          name: Scheduler
          description: (Required) Used Scheduler. Scheduler can be added in the helpers section in your home assistant settings.
          selector:
            entity:
              domain: schedule

        month_selector:
          name: Month Selector
          description: (Required) Select one or more months for the heating period.
          default: ["10","11","12","1","2","3"]
          selector:
            select:
              options:
                - label: "January"
                  value: "1"
                - label: "February"
                  value: "2"
                - label: "March"
                  value: "3"
                - label: "April"
                  value: "4"
                - label: "May"
                  value: "5"
                - label: "June"
                  value: "6"
                - label: "July"
                  value: "7"
                - label: "August"
                  value: "8"
                - label: "September"
                  value: "9"
                - label: "October"
                  value: "10"
                - label: "November"
                  value: "11"
                - label: "December"
                  value: "12"
              multiple: true
              mode: dropdown

    section_thermostats:
      name: Thermostats & Temperatures
      icon: mdi:thermostat
      collapsed: false
      input:
        thermostat_target:
          name: Thermostats
          description: (Required) Choose the thermostats to be used for heating. Choose Entity (not Device).
          selector:
            target:
              entity:
                integration: better_thermostat
                domain: climate

        set_bt_temp:
          name: Target Temperature
          description: Set the heating target temperature.
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C

        set_bt_temp_after:
          name: Reset Temperature
          description: Reset the temperature after heating.
          default: 18
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C

        sensor_control:
          name: Sensor Control
          description: (Required) External temperature sensor. If temp is higher than target temperature, then disable thermostat.
          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class:
                    - temperature
              multiple: false

    section_boost:
      name: Boost
      icon: mdi:rocket-launch-outline
      collapsed: true
      input:
        timer_helper:
          name: Boost Timer
          description: Required. Timer can be added in the helpers section in your home assistant settings.
          selector:
            entity:
              domain: timer

        set_boost_bt_temp:
          name: Set Boost Temperature
          description: Set the heating boost temperature.
          default: 30
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C

    section_advanced:
      name: Advanced / Safety
      icon: mdi:shield-alert-outline
      collapsed: true
      input:
        safety_temp:
          name: Safety Dip Temperature
          description: Temporary low temperature briefly set before turning the thermostat off, so it fully closes the valve.
          default: 5
          selector:
            number:
              min: 4
              max: 15
              step: 0.5
              unit_of_measurement: °C

mode: queued
max_exceeded: silent

trigger:
  - platform: state #schedule control off trigger
    entity_id: !input bt_times_schedule
    to: "off"
    id: "to_off"
  - platform: state #schedule control on trigger
    entity_id: !input bt_times_schedule
    to: "on"
    id: "to_on"
  - platform: state #sensor control trigger, debounced to avoid flooding the queue on chatty sensors
    entity_id: !input sensor_control
    for:
      seconds: 15
  - platform: state #presence at zone trigger
    entity_id: !input input_persons
  - platform: state #booster active trigger
    entity_id: !input timer_helper
    to: "active"
    id: "to_active"
  - platform: state #booster idle trigger
    entity_id: !input timer_helper
    to: "idle"
    id: "to_idle"
  - platform: time_pattern  # every 5 minutes trigger to check conditions
    minutes: /5

condition: []

action:
  - variables:
      var_month_selector: !input month_selector
      var_input_persons: !input input_persons
      var_zone_entity: !input zone_entity
      # A person's state while present in a non-home zone is the zone's
      # object_id/slug (e.g. zone.buero -> "buero"), not its friendly name;
      # for the home zone it is literally "home". Comparing against the slug
      # works for both cases and for renamed/localized zones.
      var_zone_slug: "{{ var_zone_entity.split('.')[1] }}"
      var_set_bt_temp: !input set_bt_temp
      var_set_bt_temp_offset: "{{ ( var_set_bt_temp + 0.5 ) | float }}" # add x degree as offset to avoid rapid on/off switching
      var_set_bt_temp_after: !input set_bt_temp_after
      var_set_bt_temp_after_offset: "{{ ( var_set_bt_temp_after + 1.0 ) | float }}" # add x degree as offset to avoid rapid on/off switching
      var_set_boost_bt_temp: !input set_boost_bt_temp
      var_safety_temp: !input safety_temp
      var_sensor_control: !input sensor_control
      var_is_anybody_home: "{{ expand( var_input_persons ) | selectattr('state', 'eq', var_zone_slug) | list | count > 0 }}"
      var_thermostat_target: !input thermostat_target
      # Only entity targeting is supported by this blueprint's selector, so
      # entity_id is always present here.
      var_target_entities: "{{ ([var_thermostat_target.entity_id] if var_thermostat_target.entity_id is string else var_thermostat_target.entity_id) | default([], true) }}"
      # Guards used below to skip re-sending commands the targets already
      # match, which also stops the cool-down dip from repeating on every
      # retrigger while the thermostat is already off.
      var_all_off: "{{ expand(var_target_entities) | rejectattr('state', 'eq', 'off') | list | count == 0 }}"
      var_all_heat_at_target: "{{ (expand(var_target_entities) | rejectattr('state', 'eq', 'heat') | list | count == 0) and (expand(var_target_entities) | rejectattr('attributes.temperature', 'eq', var_set_bt_temp | float) | list | count == 0) }}"
      var_all_heat_at_after: "{{ (expand(var_target_entities) | rejectattr('state', 'eq', 'heat') | list | count == 0) and (expand(var_target_entities) | rejectattr('attributes.temperature', 'eq', var_set_bt_temp_after | float) | list | count == 0) }}"

  - if: #booster trigger to idle, reset to after temp
      - condition: trigger
        id: "to_idle"
    then:
      - service: climate.set_hvac_mode
        data:
          hvac_mode: heat
        target: !input thermostat_target
      - service: climate.set_temperature
        data:
          temperature: "{{ var_set_bt_temp_after }}"
        target: !input thermostat_target

  - if: #booster trigger to active, set to booster temp
      - condition: trigger
        id: "to_active"
    then:
      - service: climate.set_hvac_mode
        data:
          hvac_mode: heat
        target: !input thermostat_target
      - service: climate.set_temperature
        data:
          temperature: "{{ var_set_boost_bt_temp }}"
        target: !input thermostat_target

  - if: #normal trigger AND conditions
      - condition: template # is current month in selected months
        value_template: "{{ var_month_selector is defined and var_month_selector|length > 0 and now().month | string in var_month_selector }}"
      - condition: state # and selected schedule is on
        entity_id: !input bt_times_schedule
        state: "on"
      - condition: template # and is anybody at home
        value_template: "{{ var_is_anybody_home == true }}"
      - condition: state # boost timer is not active
        entity_id: !input timer_helper
        state: idle

    then:
      - if: # if temperature of sensor is above target temperature AND above target temperature with offset
        - condition: numeric_state
          entity_id: !input sensor_control
          above: !input set_bt_temp
        - condition: template
          value_template: "{{ states( var_sensor_control ) | float > var_set_bt_temp_offset | float }}"

        then: # set thermostate to safety-dip temp then wait X sec then set to after temp then set hvac to off
          - if:
              - condition: template
                value_template: "{{ not var_all_off }}"
            then:
              - service: climate.set_temperature
                data:
                  temperature: "{{ var_safety_temp }}"
                target: !input thermostat_target
              - delay:
                  seconds: 60
              - service: climate.set_temperature
                data:
                  temperature: "{{ var_set_bt_temp_after }}"
                target: !input thermostat_target
              - service: climate.set_hvac_mode
                data:
                  hvac_mode: 'off'
                target: !input thermostat_target

        else: # set thermostate to heat and set target temperature
          - if:
              - condition: template
                value_template: "{{ not var_all_heat_at_target }}"
            then:
              - service: climate.set_hvac_mode
                data:
                  hvac_mode: heat
                target: !input thermostat_target
              - service: climate.set_temperature
                data:
                  temperature: "{{ var_set_bt_temp }}"
                target: !input thermostat_target

    else:
      - if:
        - condition: state  # boost timer is idle
          entity_id: !input timer_helper
          state: idle

        then: #reset temperature after
          - if: # if temperature of sensor is above target temperature after
            - condition: numeric_state
              entity_id: !input sensor_control
              above: !input set_bt_temp_after
            - condition: template
              value_template: "{{ states(var_sensor_control) | float > var_set_bt_temp_after_offset | float }}"

            then:
              - if:
                  - condition: template
                    value_template: "{{ not var_all_off }}"
                then:
                  - service: climate.set_temperature
                    data:
                      temperature: "{{ var_safety_temp }}"
                    target: !input thermostat_target
                  - delay:
                      seconds: 60
                  - service: climate.set_temperature
                    data:
                      temperature: "{{ var_set_bt_temp_after }}"
                    target: !input thermostat_target
                  - service: climate.set_hvac_mode
                    data:
                      hvac_mode: 'off'
                    target: !input thermostat_target

            else:
              - if:
                  - condition: template
                    value_template: "{{ not var_all_heat_at_after }}"
                then:
                  - service: climate.set_hvac_mode
                    data:
                      hvac_mode: heat
                    target: !input thermostat_target
                  - service: climate.set_temperature
                    data:
                      temperature: "{{ var_set_bt_temp_after }}"
                    target: !input thermostat_target
        
        else: # timer boost is active

